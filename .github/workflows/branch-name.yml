name: Branch Name

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Conventional branch name
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          conventional='^(feat|fix|chore|docs|refactor|test|ci|perf|build|revert|release)/[a-z0-9][a-z0-9._/-]*$'
          automation='^(release-please--|dependabot/|renovate/|github-actions/)'
          if [[ ! "${HEAD_REF}" =~ ${conventional} && ! "${HEAD_REF}" =~ ${automation} ]]; then
            echo "Invalid branch name: ${HEAD_REF}" >&2
            echo "Use a conventional prefix such as feat/, fix/, chore/, docs/, refactor/, test/, or ci/." >&2
            exit 1
          fi
