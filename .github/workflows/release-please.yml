name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Publish created release
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
        run: gh workflow run publish.yml --ref main -f "tag=${RELEASE_TAG}"

      - name: Resolve release branch
        id: release_branch
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          release_branch="$(jq -r '.[0].headBranchName // empty' <<< "${RELEASE_PRS}")"
          if [[ -z "${release_branch}" ]]; then
            echo "Release Please reported a created PR without a head branch" >&2
            exit 1
          fi
          echo "name=${release_branch}" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        if: steps.release.outputs.prs_created == 'true'
        with:
          ref: ${{ steps.release_branch.outputs.name }}

      - uses: astral-sh/setup-uv@v5
        if: steps.release.outputs.prs_created == 'true'
        with:
          version: "0.12.3"

      - name: Refresh release lockfile
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_BRANCH: ${{ steps.release_branch.outputs.name }}
        run: |
          uv lock
          uv sync --locked --all-groups
          if git diff --quiet -- uv.lock; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh uv lock"
          git push origin "HEAD:${RELEASE_BRANCH}"

      - name: Start release pull request checks
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ steps.release_branch.outputs.name }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          release_pr="$(jq -r '.[0].number // empty' <<< "${RELEASE_PRS}")"
          if [[ -z "${release_pr}" ]]; then
            echo "Release Please reported a created PR without a number" >&2
            exit 1
          fi
          gh workflow run pull-request-metadata.yml --ref "${RELEASE_BRANCH}" \
            -f "pr_number=${release_pr}"
          gh workflow run version-guard.yml --ref "${RELEASE_BRANCH}"
          gh workflow run verify.yml --ref "${RELEASE_BRANCH}"

      - name: Enable release pull request auto-merge
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
        run: |
          release_pr="$(jq -r '.[0].number // empty' <<< "${RELEASE_PRS}")"
          if [[ -z "${release_pr}" ]]; then
            echo "Release Please reported a created PR without a number" >&2
            exit 1
          fi
          gh pr merge "${release_pr}" --repo "${GITHUB_REPOSITORY}" --auto --squash
