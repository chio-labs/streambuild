name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v0.2.0"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Resolve release tag
        id: release-tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          case "$TAG" in
            v0*) ;;
            *)
              echo "Refusing to publish tag '$TAG'. PyPI publishing is limited to v0* tags."
              exit 1
              ;;
          esac

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: tag
    uses: ./.github/workflows/build-distributions.yml
    with:
      ref: ${{ needs.tag.outputs.tag }}

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
