[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "streambuild"
version = "0.14.1"
description = "Declarative ClickHouse streaming pipeline planning tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "clickhouse-connect>=0.8.18",
  "PyYAML>=6.0.2",
  "polyglot-sql>=0.5.10",
  "fastapi>=0.115",
  "kafka-python-ng>=2.2.3",
  "uvicorn>=0.30",
]

[project.scripts]
stb = "streambuild.cli.entry.main.main:main"

[dependency-groups]
dev = [
  "commitizen>=4.9.1",
  "fensu>=0.8.1",
  "httpx>=0.27",
  "packaging>=24.0",
  "pre-commit>=4.3.0",
  "psycopg[binary]>=3.2.9",
  "pytest>=8.4.2",
  "pytest-cov>=7.0.0",
  "pytest-xdist>=3.6",
  "ruff>=0.12.0",
  "sqlfluff>=3.4.2",
  "testcontainers>=4.13.0",
  "ty>=0.0.1a19",
]

[tool.hatch.build]
# Built dev UI is gitignored but must ship in distributions (`make dist`).
artifacts = ["src/streambuild/dev_server/static/**"]

[tool.hatch.build.targets.wheel]
packages = ["src/streambuild", "scripts"]

[tool.commitizen]
name = "cz_conventional_commits"
version_provider = "pep621"
version_scheme = "semver2"
update_changelog_on_bump = false

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
markers = [
  "integration: marks tests that require real external services",
  "e2e: marks tests that exercise full end-to-end workflows",
  "performance: marks opt-in comparative performance guards",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.uv]
package = true
required-version = ">=0.12.3,<0.13"
